```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부산3지점 대시보드</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #f3f6fb;
  color: #172033;
}
header {
  background: #142b4a;
  color: white;
  padding: 26px 20px;
}
header h1 { margin: 0 0 8px; font-size: 25px; }
header p { margin: 0; color: #d4e1f2; font-size: 14px; }
main { max-width: 1100px; margin: auto; padding: 22px 16px; }
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 22px;
}
.card, .panel {
  background: white;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 2px 10px #182a4410;
}
.card span { color: #64748b; font-size: 14px; }
.card strong { display: block; font-size: 27px; margin-top: 10px; }
.panel h2 { font-size: 18px; margin: 0 0 16px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
button, select, input {
  border: 1px solid #d5deea;
  border-radius: 8px;
  padding: 10px 12px;
  background: white;
  font-size: 14px;
}
button { cursor: pointer; }
button.active, button.primary {
  background: #2459a9;
  color: white;
  border-color: #2459a9;
}
input { flex: 1; min-width: 180px; }
.results { display: grid; gap: 12px; }
.result {
  border: 1px solid #e5eaf2;
  border-radius: 10px;
  padding: 15px;
}
.result h3 { margin: 8px 0; font-size: 16px; }
.tag {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 6px;
  background: #e9f1ff;
  color: #2459a9;
  font-size: 12px;
}
.result p { color: #64748b; font-size: 13px; }
.result a { color: #2459a9; text-decoration: none; font-weight: bold; }
.notice { color: #64748b; font-size: 13px; line-height: 1.6; }
footer { text-align: center; padding: 24px; color: #718096; font-size: 12px; }
@media(max-width:650px) {
  .cards { grid-template-columns: 1fr; }
  header h1 { font-size: 21px; }
}
</style>
</head>
<body>
<header>
  <h1>🏥 부산3지점 대시보드</h1>
  <p>신규 개원 · 의료기관 채용 정보 | 김해 · 부산 서부권</p>
</header>
<main>
  <section class="cards">
    <div class="card">
      <span>현재 표시 중인 공고</span>
      <strong id="total">0건</strong>
    </div>
    <div class="card">
      <span>검색 대상 지역</span>
      <strong>4개 지역</strong>
    </div>
    <div class="card">
      <span>최근 갱신</span>
      <strong id="updated" style="font-size:18px">데이터 대기 중</strong>
    </div>
  </section>

  <section class="panel">
    <h2>지역별 공고 검색</h2>
    <div class="filters" id="regions">
      <button class="active" data-region="전체">전체 지역</button>
      <button data-region="김해">김해시</button>
      <button data-region="부산 강서구">강서구</button>
      <button data-region="부산 사하구">사하구</button>
      <button data-region="부산 사상구">사상구</button>
    </div>
    <div class="filters">
      <input id="keyword" placeholder="병원명, 직종, 공고 제목 검색">
      <button class="primary" id="searchBtn">검색</button>
    </div>
    <h2>공고 목록</h2>
    <div id="results" class="results"></div>
    <p class="notice">
      현재는 대시보드 화면을 준비하는 단계입니다. 검색 결과가 자동으로 연결되기 전에는
      실제 공고가 표시되지 않습니다. 공고는 원문을 통해 확인해 주세요.
    </p>
  </section>
</main>
<footer>부산3지점 내부 업무 참고용 대시보드</footer>
<script>
let selectedRegion = "전체";
const results = document.getElementById("results");
const keyword = document.getElementById("keyword");

function render() {
  results.innerHTML = "";
  document.getElementById("total").textContent = "0건";
  results.innerHTML =
    '<div class="result"><h3>아직 연결된 공고 데이터가 없습니다.</h3>' +
    '<p>다음 단계에서 GitHub 자동 검색 결과와 연결할 예정입니다.</p></div>';
}
document.querySelectorAll("#regions button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll("#regions button").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    selectedRegion = button.dataset.region;
    render();
  });
});
document.getElementById("searchBtn").addEventListener("click", render);
keyword.addEventListener("keydown", event => {
  if (event.key === "Enter") render();
});
document.getElementById("updated").textContent = new Date().toLocaleDateString("ko-KR");
render();
</script>
</body>
</html>
```
